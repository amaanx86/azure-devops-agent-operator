apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: azure-agent-image-preloader
  namespace: $(AGENT_NAMESPACE)
  labels:
    app.kubernetes.io/name: azure-agent-preloader
    app.kubernetes.io/managed-by: agentpool-operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: azure-agent-preloader
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: azure-agent-preloader
        app.kubernetes.io/managed-by: agentpool-operator
    spec:
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
      - name: preloader
        image: mcr.microsoft.com/azure-pipelines/vsts-agent:latest
        imagePullPolicy: Always
        command: ["/bin/sh", "-c"]
        args: ["echo 'Azure agent image pre-pulled on this node'; sleep infinity"]
        resources:
          requests:
            memory: "50Mi"
            cpu: "10m"
          limits:
            memory: "100Mi"
            cpu: "50m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      terminationGracePeriodSeconds: 10
