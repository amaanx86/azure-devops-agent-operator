---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - agents.amaanx86.github.io
  resources:
  - agentpools
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - agents.amaanx86.github.io
  resources:
  - agentpools/finalizers
  verbs:
  - update
- apiGroups:
  - agents.amaanx86.github.io
  resources:
  - agentpools/status
  verbs:
  - get
  - patch
  - update
